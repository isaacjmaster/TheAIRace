<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>The AI Race — Building Evolution</title><style>body{margin:0;background:#e8f4f1;color:#183443;font:16px system-ui}header,main{max-width:1250px;margin:auto;padding:28px}h1{font-size:32px;margin:8px 0}p{max-width:780px;line-height:1.5}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:10px 0 35px}.card{background:#fffcef;border:1px solid #bdd5d5;border-radius:16px;overflow:hidden}.card img{display:block;width:100%}.card strong{display:block;padding:12px}#live{width:100vw;height:100vh;position:fixed;inset:0;background:#b5eafa;z-index:3}#live:empty{display:none}@media(max-width:600px){header,main{padding:12px}.row{gap:5px}.card strong{padding:8px;font-size:13px}h1{font-size:25px}}</style></head><body><header><small>THE AI RACE · ORIGINAL GAME ASSETS</small><h1>From startup to advanced AI campus</h1><p>Ten building families, three architectural stages. All models use the live game renderer, shared materials, and the existing isometric camera direction. Storage, production and defense retain distinct silhouettes.</p></header><main id="review"></main><div id="live"></div><script type="module">
import * as THREE from 'three';
import {progressionModel} from '/src/art/BuildingLevels.ts';
import {WorldKit,lightWorld} from '/src/art/world.ts';
import {CAMPUS_CAMERA_OFFSET} from '/src/art/campusCamera.ts';
import {HeadquartersScene} from '/src/art/HeadquartersScene.ts';
import {SecurityWalls} from '/src/art/SecurityWalls.ts';
import {initialFoundation} from '/shared/foundation.ts';
import {InfiltrationScene} from '/src/art/InfiltrationScene.ts';
import {playerOperation} from '/shared/player-combat.ts';
import {commandSquad,advanceSquad} from '/shared/squad-infiltration.ts';
const names={hq:'Founder HQ',rig:'GPU Rig',lab:'Research Lab',fabricator:'Bot Fabricator',hangar:'Bot Hangar',sentinel:'Sentinel Tower',droneStation:'Security Drone Station',wall:'Security Walls',computeStorage:'Compute Storage',researchStorage:'Research Storage'};
window.renders=[];
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(600,480);renderer.setPixelRatio(1);const dummy=new THREE.Scene();lightWorld(renderer,dummy);dummy.traverse(n=>{if(n.shadow)n.shadow.dispose();});
for(const [kind,name]of Object.entries(names)){const title=document.createElement('h2');title.textContent=name;review.append(title);const row=document.createElement('section');row.className='row';review.append(row);for(const level of [1,2,3]){const scene=new THREE.Scene(),kit=new WorldKit('campus');lightWorld(renderer,scene);scene.fog=null;scene.background=new THREE.Color('#d5edf0');const model=progressionModel(kit,kind,level);scene.add(model);const bounds=new THREE.Box3().setFromObject(model),center=bounds.getCenter(new THREE.Vector3()),size=bounds.getSize(new THREE.Vector3()),span=kind==='hq'?13:kind==='hangar'?10.7:kind==='wall'?2.5:6.2;kit.box(scene,[span*1.4,.12,span*1.2],[0,-.12,0],'#a2ba83',.12);const camera=new THREE.OrthographicCamera(-span/2,span/2,span*.4,-span*.4,.1,300);camera.position.copy(center).add(CAMPUS_CAMERA_OFFSET);camera.lookAt(center);renderer.render(scene,camera);const data=renderer.domElement.toDataURL('image/png');window.renders.push({name:`${kind}-${level}`,data});const card=document.createElement('article');card.className='card';card.innerHTML=`<img alt="${name} Level ${level}" src="${data}"><strong>Level ${level}</strong>`;row.append(card);kit.dispose();scene.traverse(n=>{if(n.shadow)n.shadow.dispose();});}}
// Joined half-panels share center posts, even across level boundaries.
{const scene=new THREE.Scene();lightWorld(renderer,scene);scene.fog=null;const list=[];for(let x=-3;x<=3;x++)list.push({id:'h'+x,x,z:0,w:1,d:1,level:x<0?1:x===0?2:3});for(let z=-2;z<=2;z++)if(z)list.push({id:'v'+z,x:0,z,w:1,d:1,level:z<0?2:3});for(let z=1;z<=2;z++)list.push({id:'c'+z,x:3,z,w:1,d:1,level:3});const walls=new SecurityWalls(list);scene.add(walls.group);const camera=new THREE.OrthographicCamera(-5,5,4,-4,.1,300);camera.position.copy(CAMPUS_CAMERA_OFFSET);camera.lookAt(0,0,0);renderer.render(scene,camera);const data=renderer.domElement.toDataURL();window.renders.push({name:'mixed-wall-junctions',data});review.insertAdjacentHTML('beforeend',`<h2>Mixed-level corners and junctions</h2><img style="max-width:100%" src="${data}" alt="Joined walls of three levels">`);walls.dispose();scene.traverse(n=>{if(n.shadow)n.shadow.dispose();});}
renderer.dispose();renderer.forceContextLoss();
const empty={version:1,hq:1,buildings:{compute:0,revenue:0,training:0,gpu:0,research:0,defense:0},construction:null,constructions:[],lastAccruedAt:0,highestRaid:0,raidWins:{}};
const layouts={hq:[-4.5,-4],rig:[5.5,-5.5],lab:[-9.5,3.5],fabricator:[-4.5,5.5],hangar:[4,5.5],sentinel:[-12,-4],droneStation:[10,-.5],computeStorage:[-9.5,10],researchStorage:[10,9.5]};let view,op,frame;
function state(level){const s=initialFoundation();s.founderHqLevel=level;s.level=2;s.builders=2;s.starterStation='placed';s.bots=8;s.breachers=2;s.hqLayout={position:layouts.hq,orientation:0};s.buildingLevels={};for(const [id,position]of Object.entries(layouts)){s.buildingLevels[id]=level;if(id==='hq')continue;s[id]={position,orientation:0,startedAt:0,completesAt:0,...(id==='rig'||id==='lab'?{stored:20,lastCollectedAt:0}:{}),...(id==='hangar'?{size:'compound'}:{})};}s.walls=[];for(let x=-14;x<=12;x++)for(const z of [-10.5,13.5]){const id='h'+x+','+z;s.walls.push({id,position:[x+.5,z],orientation:0});s.buildingLevels['wall:'+id]=level;}return s;}
window.cleanup=()=>{cancelAnimationFrame(frame);view?.dispose();view=undefined;live.replaceChildren();};
window.campus=async level=>{window.cleanup();view=new HeadquartersScene(live,0,0,structuredClone(empty),()=>{throw Error('WebGL failed')},true);const s=state(level);view.syncLandmarks(s);view.syncRig(s,1000);view.syncBots(s,1000);view.syncBuildingVisuals(s,1000);view.target.set(0,0,1);view.center.set(0,0,1);let t=performance.now();function tick(n){view.update(Math.min(.05,(n-t)/1000));t=n;frame=requestAnimationFrame(tick);}frame=requestAnimationFrame(tick);await new Promise(r=>setTimeout(r,1200));return{calls:view.renderer.info.render.calls,triangles:view.renderer.info.render.triangles,levels:s.buildingLevels};};
window.combat=async()=>{window.cleanup();const s=state(3),buildings=Object.entries(layouts).map(([id,position])=>({id,position,orientation:0,level:3,complete:true,...(id==='hangar'?{size:'compound'}:{})}));const base={version:1,companyId:'progression-review',capturedAt:1000,buildings,walls:s.walls.map(w=>({...w,level:3})),decorations:[],scenery:[]};op=playerOperation('review',base,{id:'progression-review',name:'Advanced AI Campus',level:3,hqLevel:3,influence:0,rank:null,visitable:true},'isolated',1000);op.squad.undeployed=10;op.squad.undeployedBreacher=2;for(let i=0;i<2;i++)commandSquad(op,{action:'deploy',troop:'breacher',position:op.target.entry},1000);for(let i=0;i<10;i++)commandSquad(op,{action:'deploy',troop:'pulsewheel',position:op.target.entry},1000);view=new InfiltrationScene(live,op,{replay:true});let t=performance.now();function tick(n){advanceSquad(op,op.lastTick+Math.min(50,n-t));view.sync(op,op.lastTick);view.update(Math.min(.05,(n-t)/1000));t=n;frame=requestAnimationFrame(tick);}frame=requestAnimationFrame(tick);};
window.verifyUpdates=async()=>{await window.campus(1);const s=state(1),rig=view.rigGroup,hq=view.founderHouse,hangar=view.hangarGroup;s.buildingLevels.rig=3;view.syncBuildingVisuals(s,1000);const first=view.rigGroup.getObjectByName('building-level-details');view.syncBuildingVisuals(s,1000);const result={unrelatedHqPreserved:view.founderHouse===hq,unrelatedHangarPreserved:view.hangarGroup===hangar,rigBasePreserved:view.rigGroup===rig,levelDetailsStable:view.rigGroup.getObjectByName('building-level-details')===first,level:first?.userData.level,computeStoragePickable:!!view.storageGroups.get('computeStorage'),researchStoragePickable:!!view.storageGroups.get('researchStorage')};if(Object.values(result).some(v=>v===false)||result.level!==3)throw Error('Incremental model update failed '+JSON.stringify(result));window.cleanup();return result;};
window.verifyUpgradeLifecycle=async()=>{await window.campus(1);const s=state(1),samples=[];for(let i=0;i<72;i++){s.buildingUpgrades={rig:{id:'rig',targetLevel:i%2?3:2,startedAt:1000,completesAt:2000}};view.syncBuildingVisuals(s,1500);view.update(.016);s.buildingLevels.rig=i%2?3:2;s.buildingUpgrades={};view.syncBuildingVisuals(s,2000);view.update(1);view.update(.016);if(i===23||i===47||i===71){let objects=0;view.scene.traverse(()=>objects++);samples.push({cycle:i+1,geometries:view.renderer.info.memory.geometries,textures:view.renderer.info.memory.textures,objects,completionEffects:view.constructionVisuals.effects.length});}}if(samples[2].geometries>samples[1].geometries||samples[2].objects>samples[1].objects||samples[2].completionEffects!==0)throw Error('Upgrade lifecycle accumulation '+JSON.stringify(samples));window.cleanup();return samples;};
window.reviewReady=true;
</script></body></html>
